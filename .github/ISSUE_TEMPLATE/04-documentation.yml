name: Documentation Issue
description: Report missing, outdated or unclear documentation for kora_drugs.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in kora_drugs
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Drug creator, Production recipes, Items and effects, Configuration.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
